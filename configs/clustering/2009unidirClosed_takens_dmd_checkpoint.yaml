# Experiment documentation: http://ped.fz-juelich.de/da/2009unidirClosed
# Input orientation: we only observe half of the track, people walking down
# straight part of the corridor from x = [1, b], b = {1, 1.4, 1.8}, y = [0, 6]
# hence we only want to cut from the top and bottom
# ____
#       \
# _       \
#    \      \
#     \      \
#      |      |
#      |      |
#      |      |
#      |      |
#     /      /
#    /      /
# _ /      /
#         /
# _____ /

preprocessing:
  system_observables:
    - density
    - velocity_x
    - velocity_y
  store_tsc_data: true
data:
  load_data_from_checkpoint: '20250710_235416'
algorithm:
  learning_algo: edmd
  sort_koopman_triplets: false
  pseudospectrum_residual_filter:
    keep_n: 400
  use_temporal_embedding: true
  rank: 400
  use_diffusion_maps: false
visualization:
  compute_pseudospectrum: true
  plot_supermodes: false
  visualization_timesteps:
    - 0
    - 25
    - 50
    - 100
    - 125
  generate_timeseries_gifs: null
evaluation:
  store_trained_model: true
  extra_prediction_steps: 50
temporal_embedding:
  num_t_delays: 4
  frequency: 3
  lag: 0
