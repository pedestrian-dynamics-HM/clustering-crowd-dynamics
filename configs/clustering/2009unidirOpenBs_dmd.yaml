# Experiment documentation: http://ped.fz-juelich.de/da/2009unidirOpen
# Input orientation: people walking downwards through the bottleneck
# hence we only want to cut from the top and bottom, bottlenck is at 3
#    |               |
#    |       |       |
#    |       √       |
#    |               |
#         |     |
#         |     |
#         |     |
#         |     |

meta:
  scenario: 2009unidirOpenB
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - null
    - 4.8
  ylim:
    - 1.7
    - 13.3
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 0.8
  spatial_smoothing_neighborhood: 3
  obstacle_scaling: 0
  store_tsc_data: false
data:
  selection_parameters:
    - uo-300-300-200.txt
    - uo-300-300-160.txt
    - uo-300-300-120.txt
    - uo-300-300-080.txt
    - uo-240-240-160.txt
    - uo-240-240-130.txt
    - uo-240-240-100.txt
    - uo-180-180-120.txt
    - uo-180-180-095.txt
    - uo-180-180-070.txt
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 200
visualization:
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  vector_scaling: 0.2
  visualization_timesteps:
    - 0
    - 40
    - 80
    - 120
    - 160
    - 200
  generate_timeseries_gifs:
    - 100180180070
    - 100180180095
    - 100180180120
    - 100240240100
    - 100240240130
    - 100240240160
    - 100300300080
    - 100300300120
    - 100300300160
    - 100300300200
  rotation: 0
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (3_7)
    - (5_7)
    - (5_12)
