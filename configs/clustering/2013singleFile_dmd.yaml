# Experiment documentation: http://ped.fz-juelich.de/da/2013singleFile
# Input orientation: people walk on a oval track (NOT 1d_ prefix)
# coordinates are transformed into walking left to right
# we may cut off start and end but do not need to
#              _________________
#           /                    \
#         /      ____________      \
#       /      /              \      \
#      /      /                \      \
#      |     |                  |      |
#       \     \                /      /
#        \      \ ___________ /      /
#          \                       /
#            \ _________________ /

meta:
  scenario: 2013singleFile
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - null
    - 4
  ylim:
    - 4.6
    - 9
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 0.8
  spatial_smoothing_neighborhood: 3
  obstacle_scaling: 0
  store_tsc_data: false
data:
  selection_parameters:
    - PHASE_SEP_1_pos.csv
    - PHASE_SEP_2_pos.csv
    - PHASE_SEP_3_pos.csv
    - PHASE_SEP_4_pos.csv
    - PHASE_SEP_5_pos.csv
    - PHASE_SEP_6_pos.csv
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 200
visualization:
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  vector_scaling: 0.3
  visualization_timesteps:
    - 0
    - 50
    - 150
    - 300
    - 500
  generate_timeseries_gifs:
    - 1001
    - 1002
    - 1003
    - 1006
    - 1005
    - 1004
  rotation: 0
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (3_5)
    - (6_5)
    - (9_5)
