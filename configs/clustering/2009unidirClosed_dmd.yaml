# Experiment documentation: http://ped.fz-juelich.de/da/2009unidirClosed
# Input orientation: we only observe half of the track, people walking down
# straight part of the corridor from x = [1, b], b = {1, 1.4, 1.8}, y = [0, 6]
# hence we only want to cut from the top and bottom
# ____
#       \
# _       \
#    \      \
#     \      \
#      |      |
#      |      |
#      |      |
#      |      |
#     /      /
#    /      /
# _ /      /
#         /
# _____ /

meta:
  scenario: 2009unidirClosed
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - null
    - 3.6
  ylim:
    - 0
    - 6
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 0.8
  spatial_smoothing_neighborhood: 3
  obstacle_scaling: 0
  store_tsc_data: false
data:
  selection_parameters:
    - ug-100-007.txt
    - ug-100-015.txt
    - ug-100-030.txt
    - ug-100-045.txt
    - ug-100-060.txt
    - ug-100-075.txt
    - ug-100-090.txt
    - ug-100-120.txt
    - ug-140-010.txt
    - ug-140-020.txt
    - ug-140-045.txt
    - ug-140-065.txt
    - ug-140-085.txt
    - ug-140-110.txt
    - ug-140-130.txt
    - ug-180-015.txt
    - ug-180-030.txt
    - ug-180-060.txt
    - ug-180-085.txt
    - ug-180-095.txt
    - ug-180-110.txt
    - ug-180-110v2.txt
    - ug-180-140.txt
    - ug-180-230.txt
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 200
visualization:
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  vector_scaling: 0.3
  visualization_timesteps:
    - 0
    - 40
    - 80
    - 120
    - 160
    - 200
  generate_timeseries_gifs:
    - 100100007
    - 100100015
    - 100100030
    - 100100045
    - 100100060
    - 100100075
    - 100100090
    - 100100120
    - 100140010
    - 100140020
    - 100140045
    - 100140065
    - 100140085
    - 100140110
    - 100140130
    - 100180015
    - 100180030
    - 100180060
    - 100180085
    - 100180095
    - 100180110
    - 100180140
    - 100180230
    - 1001801102
  rotation: 0
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (4_2)
    - (4_7)
    - (4_12)
