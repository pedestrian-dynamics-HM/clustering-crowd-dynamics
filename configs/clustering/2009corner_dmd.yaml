# Experiment documentation: http://ped.fz-juelich.de/da/2009corner
# Input orientation: people walking from the bottom right to the upper left
# hence we only want to cut from the top or from the right
#   |       |
#   |       |
#   |   ^   |
#   |   |   |__________
#   |
#   |           <--
#   |__________________

meta:
  scenario: 2009corner
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - 0
    - 6.4
  ylim:
    - 0
    - 6.8
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 1.2
  spatial_smoothing_neighborhood: 5
  obstacle_scaling: 0
  obstacles:
    - - !!python/tuple
        - 3.6
        - 3.6
      - 4
      - 4
  store_tsc_data: false
data:
  selection_parameters:
    - eo-240-050-240.txt
    - eo-240-060-240.txt
    - eo-240-080-240.txt
    - eo-240-100-240.txt
    - eo-240-150-240.txt
    - eo-240-240-240.txt
    - eo-300-050-300.txt
    - eo-300-060-300.txt
    - eo-300-080-300.txt
    - eo-300-100-300.txt
    - eo-300-150-300.txt
    - eo-300-300-300.txt
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 100
visualization:
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  vector_scaling: 0.3
  visualization_timesteps:
    - 0
    - 25
    - 50
    - 100
    - 125
  generate_timeseries_gifs:
    - 100240050240
    - 100240060240
    - 100240080240
    - 100240100240
    - 100240150240
    - 100240240240
    - 100300050300
    - 100300060300
    - 100300080300
    - 100300100300
    - 100300150300
    - 100300300300
  rotation: 90
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (12_4)
    - (4_10)
    - (4_15)
