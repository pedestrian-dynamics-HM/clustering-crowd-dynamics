# Experiment documentation: http://ped.fz-juelich.de/da/2013bidirectional
# Input orientation: people walking up and down with no further instructions
# hence we only want to cut from the top and bottom
#    |         |
#    |         |
#    |  |   ^  |
#    |  √   |  |
#    |         |
#    |         |
#    |         |

meta:
  scenario: 2013bidirectional_A
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - null
    - 6
  ylim:
    - 3
    - 13.4
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 1.2
  spatial_smoothing_neighborhood: 5
  store_tsc_data: false
data:
  selection_parameters:
    - BI_CORR_400_A_1.txt
    - BI_CORR_400_A_2.txt
    - BI_CORR_400_A_3.txt
    - BI_CORR_400_A_4.txt
    - BI_CORR_400_A_5.txt
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 100
visualization:
  vector_scaling: 0.3
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  visualization_timesteps:
    - 0
    - 25
    - 50
    - 100
    - 125
  generate_timeseries_gifs:
    - 1004001
    - 1004002
    - 1004003
    - 1004004
    - 1004005
  rotation: 0
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (12_4)
    - (6_10)
    - (6_15)
