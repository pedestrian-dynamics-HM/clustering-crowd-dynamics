# Experiment documentation: http://ped.fz-juelich.de/da/2009unidirOpen
# Input orientation: people walking downwards through the bottleneck
# hence we only want to cut from the top and bottom
#    |         |
#    |         |
#    |    |    |
#    |    √    |
#    |         |
#    |         |
#    |         |

meta:
  scenario: 2009unidirOpenC
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - null
    - 6.4
  ylim:
    - 2
    - 13.2
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 0.8
  spatial_smoothing_neighborhood: 3
  obstacle_scaling: 0
  store_tsc_data: false
data:
  selection_parameters:
    - uo-300-300-300.txt
    - uo-240-300-300.txt
    - uo-240-240-240.txt
    - uo-190-240-240.txt
    - uo-180-300-300.txt
    - uo-180-180-180.txt
    - uo-145-240-240.txt
    - uo-145-180-180.txt
    - uo-120-300-300.txt
    - uo-100-300-300.txt
    - uo-100-180-180.txt
    - uo-095-240-240.txt
    - uo-080-300-300v2.txt
    - uo-080-240-240.txt
    - uo-070-180-180.txt
    - uo-065-240-240.txt
    - uo-060-180-180.txt
    - uo-050-180-180.txt
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 200
visualization:
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  vector_scaling: 0.3
  visualization_timesteps:
    - 0
    - 40
    - 80
    - 120
    - 160
    - 200
  generate_timeseries_gifs:
    - 1003003002
    - 100050180180
    - 100060180180
    - 100065240240
    - 100070180180
    - 100080240240
    - 100095240240
    - 100100180180
    - 100100300300
    - 100120300300
    - 100145180180
    - 100145240240
    - 100180180180
    - 100180300300
    - 100190240240
    - 100240240240
    - 100240300300
    - 100300300300
  rotation: 0
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (7_9)
    - (7_18)
    - (10_24)
