# Experiment documentation: https://ped.fz-juelich.de/da/2013crossing90
# Input orientation: people walk into and out of the crossing in various directions
# we may cut from all sides
#             |        |
#             |  ^  √  |
#             |  ^  √  |
#   __________|        |__________
#
#       < <        ∆       > >
#       > >                < <
#   __________          __________
#             |        |
#             |        |
#             |  ^  √  |
#             |  ^   √ |

meta:
  scenario: 2013crossing90
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - 2.4
    - 13.6
  ylim:
    - 2
    - 13.6
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 0.8
  spatial_smoothing_neighborhood: 3
  store_tsc_data: false
data:
  selection_parameters:
    - CROSSING_90_G7_1.txt
    - CROSSING_90_G7_2.txt
    - CROSSING_90_G7_3.txt
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 200
visualization:
  vector_scaling: 0.3
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  visualization_timesteps:
    - 0
    - 100
    - 200
    - 300
    - 400
  generate_timeseries_gifs:
    - 1009041
    - 1009042
    - 1009043
    - 1009045
    - 1009046
    - 1009047
    - 1009048
    - 1009051
    - 1009056
    - 1009061
    - 1009063
    - 1009071
    - 1009072
    - 1009073
  rotation: 0
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (13_4)
    - (13_22)
    - (4_14)
