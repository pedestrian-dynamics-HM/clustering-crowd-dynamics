# Experiment documentation: http://ped.fz-juelich.de/da/2006bottleneck
# Input orientation: people walking upwards through the bottleneck
# hence we only want to cut from the top
#         |     |
#         |     |
#         |     |
#         |     |
#    |               |
#    |       ^       |
#    |       |       |
#    |               |

meta:
  scenario: 2006bottleneck
  raw_data_dir: data/juelich_trajectories
preprocessing:
  average_across_simulations: false
  grid_resolution: 0.4
  temporal_resolution: 0.2
  interpolate: true
  xlim:
    - null
    - null
  ylim:
    - 0.8
    - 6.0
  tlim:
    - 0
    - null
  system_observables:
    - count
    - density
    - velocity_x
    - velocity_y
  spatial_smoothing_bandwidth: 0.8
  spatial_smoothing_neighborhood: 3
  obstacle_scaling: 0
  store_tsc_data: false
data:
  selection_parameters:
    - b090_combined.txt
    - b100_combined.txt
    - b110_combined.txt
    - b120_combined.txt
    - b140_combined.txt
    - b160_combined.txt
    - b180_combined.txt
    - b200_combined.txt
    - b220_combined.txt
    - b250_combined.txt
algorithm:
  learning_algo: dmd
  sort_koopman_triplets: false
  rank: 200
visualization:
  compute_pseudospectrum: false
  plot_supermodes: false
  plot_diffusion_maps: false
  vector_scaling: 0.3
  visualization_timesteps:
    - 0
    - 40
    - 80
    - 120
    - 160
    - 200
  generate_timeseries_gifs:
    - 100090
    - 100100
    - 100110
    - 100120
    - 100140
    - 100160
    - 100180
    - 100200
    - 100220
    - 100250
  rotation: 180
evaluation:
  store_trained_model: false
  extra_prediction_steps: 50
  measurement_cells:
    - (6_10)
    - (6_7)
    - (3_7)
